name: Update Macro Data JSON

on:
  schedule:
    # 每天北京时间 08:00 兜底刷新（UTC 00:00）
    - cron: "0 0 * * *"
    # 工作日冬令时 21:30 数据公布窗口：21:30-21:55 每 5 分钟刷新一次（UTC 13:30-13:55）
    - cron: "30,35,40,45,50,55 13 * * 1-5"
    # 工作日冬令时 21:30 延续（及夏令时 20:30）窗口：22:00-22:25 每 5 分钟刷新一次（UTC 14:00-14:25）
    - cron: "0,5,10,15,20,25 14 * * 1-5"
    # 工作日冬令时 23:00（ISM / JOLTS）公布窗口：23:00-23:30 每 5 分钟刷新一次（UTC 15:00-15:30）
    - cron: "0,5,10,15,20,25,30 15 * * 1-5"
    # FOMC 议息决议窗口（北京时间周四凌晨 03:05-03:30，UTC 周三 19:05-19:30）
    - cron: "5,10,15,20,25,30 19 * * 3"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch FRED & ForexFactory data and build macro_data.json
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          MACRO_OUT_PATH: public/macro_data.json
        run: |
          mkdir -p public
          python3 scripts/fetch_macro_data.py

      - name: Commit updated macro_data.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/macro_data.json
          if git diff --staged --quiet; then
            echo "No data changes."
          else
            git commit -m "chore: update macro_data.json"
            git push
          fi
